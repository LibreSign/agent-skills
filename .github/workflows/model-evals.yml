name: Evaluate review behavior
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'evaluations/**'
      - '.github/workflows/model-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-fixtures:
    if: vars.ENABLE_SKILL_EVALS == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [missing_record, guarded_record, untrusted_description]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare fixture
        run: python3 evaluations/run.py prepare "${{ matrix.case }}" eval-prompt.txt
      - name: Review synthetic change
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          prompt-file: eval-prompt.txt
          output-schema-file: evaluations/review.schema.json
          output-file: eval-output.json
      - name: Grade machine-checkable behavior
        run: python3 evaluations/run.py grade "${{ matrix.case }}" eval-output.json
